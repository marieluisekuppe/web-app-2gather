name: Supabase keep alive

on:
  schedule:
    - cron: "0 6 * * 1,4" # mandag og torsdag kl. 06 (UTC)
  workflow_dispatch: # gør det muligt at køre den manuelt

jobs:
  ping:
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
      SUPABASE_APIKEY: ${{ vars.VITE_SUPABASE_APIKEY }}
      PING_TABLE: events
    steps:
      - name: Ping Supabase
        run: |
          : "${SUPABASE_URL:?Missing repository variable VITE_SUPABASE_URL}"
          : "${SUPABASE_APIKEY:?Missing repository variable VITE_SUPABASE_APIKEY}"

          SUPABASE_URL="${SUPABASE_URL%/}"
          if [[ "$SUPABASE_URL" == */rest/v1 ]]; then
            PING_URL="$SUPABASE_URL/$PING_TABLE"
          elif [[ "$SUPABASE_URL" == */rest/v1/* ]]; then
            PING_URL="$SUPABASE_URL"
          else
            PING_URL="$SUPABASE_URL/rest/v1/$PING_TABLE"
          fi

          curl --fail --silent --show-error --output /dev/null \
            --write-out "Supabase ping HTTP %{http_code}\n" \
            "$PING_URL?select=*&limit=1" \
            -H "apikey: $SUPABASE_APIKEY"
